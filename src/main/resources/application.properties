spring.application.name=Telehealth_With_AI
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/telehealth}
spring.datasource.username=${DB_USERNAME:telehealth}
spring.datasource.password=${DB_PASSWORD:telehealth}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

server.port=8081
# Local fallback exists only to reduce setup friction. Replace it using an
# environment variable before recording a public demo or pushing to GitHub.
app.jwt.secret=${JWT_SECRET:change-this-local-demo-secret-to-a-long-random-value-32-bytes-minimum}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}